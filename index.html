ound:#fffefa;border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:0 25px 80px rgba(34,30,25,.18)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{font:800 21px Manrope;margin:0}.modal-head button{background:#ffe4d3;border-radius:10px;width:34px;height:34px;font-size:20px}.toast{position:fixed;bottom:24px;right:24px;background:#242328;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:60}.toast.show{opacity:1;transform:none}.quote{background:#242328!important;color:#fff}.mood-row{display:flex;gap:8px;flex-wrap:wrap}.mood{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;font-size:22px}.upload{border:1px dashed #b9d5b7;background:#f4faf2;border-radius:16px;padding:18px;text-align:center}.file-list{display:grid;gap:8px;margin-top:12px}.file-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#faf9f6;border:1px solid var(--line);border-radius:12px}.student-folder{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lesson-plan{background:#fff8f1;border:1px solid #ffe4d3}.pill{display:inline-flex;padding:6px 9px;border-radius:99px;background:#eaf4e8;color:#486c4c;font-size:12px;font-weight:700}.navbtn{background:transparent;text-align:left;padding:12px 13px;border-radius:13px;color:#65635e;font-weight:600;font-size:14px}.navbtn.active{background:#e0f1df;color:#315536}.navbtn:hover{background:#eeece7}.mobile-menu{display:none;background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 11px;margin-right:8px}.sidebar-placeholder{display:none}

.marketing-task{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid rgba(30,30,30,.08);transition:.2s}.marketing-task:last-of-type{border-bottom:0}.marketing-task.done{opacity:.62}.marketing-copy{flex:1}.marketing-title{font-weight:700;font-size:16px}.marketing-meta{font-size:12px;color:#8a887f;margin-top:4px}.marketing-why,.marketing-benefit{font-size:13px;line-height:1.55;margin-top:7px;color:#55534d}.marketing-benefit{color:#3f6650}.check-wrap{position:relative;display:block;width:28px;height:28px;flex:0 0 28px}.check-wrap input{position:absolute;opacity:0;width:0;height:0}.checkmark{display:flex;width:28px;height:28px;border:1.5px solid #b7b3a9;border-radius:9px;background:#fff;align-items:center;justify-content:center;cursor:pointer;transition:.2s}.check-wrap input:checked+.checkmark{background:#6e9d79;border-color:#6e9d79}.check-wrap input:checked+.checkmark:after{content:'✓';color:white;font-size:16px;font-weight:700}.marketing-task.done .marketing-title{text-decoration:line-through;text-decoration-thickness:1px}
.home-welcome{padding:8px 0 4px}.home-welcome h1{margin-bottom:6px}.btn{transition:.18s}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:var(--green);color:#29412d}.goal{background:linear-gradient(135deg,#e8f4e6,#ffe9dc)}.goal:after{background:#ffd8c2}.navbtn.active{background:var(--green);color:#29412d}.pill{background:var(--peach);color:#674b3d}.marketing-task:hover{background:#fff8f3}.summer-phase{background:#fffefa}.summer-phase:nth-child(even){background:#fff7f0}.summer-note{text-align:center;margin-top:20px;padding:8px 20px;color:#77756f;font:600 16px/1.7 Manrope}.summer-note span{font-size:14px;font-weight:500}</style></head><body><div class="app">

const KEY="sasha-cabinet-v9";
function activeStudents(){return (state.students||[]).filter(x=>(x.status||"active")==="active").length;}
function countedGoalStudents(){return (state.students||[]).filter(x=>(x.status||"active")==="active"&&x.newForPlan===true).length;}
function remainingMarketingStudents(){const target=Math.max(0,Number(state.settings?.targetStudents)||0);return Math.max(0,target-countedGoalStudents());}
function syncDerivedSettings(){state.settings=state.settings||{};state.settings.targetStudents=Math.max(0,Number(state.settings.targetStudents)||0);state.settings.targetStudentsManual=true;state.settings.targetNewStudents=remainingMarketingStudents();state.settings.students=activeStudents();}
const CANONICAL_NAV=["home","students","calendar","development","summer","texts","partners","money","balance","ai","settings"];
const defaultTexts=[
{title:"Profi · готовый профиль",body:"Репетитор по информатике | ЕГЭ · Python · разбор ошибок\n\nПомогаю школьникам подготовиться к ЕГЭ по информатике без хаотичного решения задач. Сначала разбираемся, где ученик сейчас находится, какие темы уже получаются и где именно возникают ошибки. Затем собираем понятный план подготовки и постепенно закрываем пробелы практикой.\n\nРаботаем с ЕГЭ, Python и задачами экзаменационного формата. Мне важно не просто показать правильный ответ, а объяснить, почему решение работает и как научиться находить его самостоятельно.\n\nНа старте можно пройти короткую бесплатную диагностику: определим цель, уровень и несколько точек, которые сейчас мешают двигаться дальше. После неё будет понятно, с чего логичнее начать.\n\nОнлайн · индивидуально · 2 500 ₽ / 60 минут"},
{title:"Profi · фото профиля — готовое ТЗ",body:"Основное фото: естественный портрет по грудь, Саша смотрит в камеру, спокойная доброжелательная улыбка. Светлое нейтральное пространство, мягкий дневной свет, без сильных фильтров и чрезмерной ретуши. Одежда спокойная и аккуратная, без крупных логотипов.\n\nВажно: лицо должно занимать заметную часть кадра, взгляд открытый, фон не отвлекает. Фото должно выглядеть как фотография живого преподавателя, а не как стоковая картинка или рекламный баннер.\n\nЕсли хочется добавить рабочий контекст — можно использовать второе фото: ноутбук/экран с Python или фрагментом учебного материала, но основным оставить человеческий портрет."},
{title:"Avito · заголовок",body:"Репетитор по информатике — ЕГЭ, Python, разбор ошибок"},

{title:"Profi · первое сообщение",body:"Здравствуйте! Я Саша, преподаватель информатики. Помогаю школьникам подготовиться к ЕГЭ и разобраться с Python без хаотичного решения задач.\n\nЕсли хотите, могу сначала провести короткую бесплатную диагностику: посмотрим цель, уровень и несколько типичных задач. После неё будет понятно, где именно сейчас теряются баллы и что лучше делать дальше."},
{title:"Avito · объявление",body:"ЕГЭ по информатике и Python — с понятным планом подготовки\n\nЕсли информатика кажется набором отдельных тем, проблема часто не в способностях, а в том, что не видно системы. На занятиях разбираем не только «как решить», но и почему возникает ошибка и как не повторять её снова.\n\nЧто делаем:\n• определяем текущий уровень и цель;\n• находим пробелы;\n• разбираем задачи ЕГЭ и Python;\n• собираем индивидуальный план;\n• отслеживаем прогресс.\n\nМожно начать с короткой бесплатной диагностики — она поможет понять, с чего лучше начать именно вам."},
{title:"Яндекс Услуги · описание",body:"Подготовка к ЕГЭ по информатике и Python\n\nПомогаю школьникам системно подготовиться к экзамену, разобраться с Python и закрыть темы, которые мешают двигаться дальше.\n\nНа старте определяем цель и уровень, разбираем 3–5 небольших заданий, находим типичные ошибки и составляем понятный следующий шаг. На занятиях важен не только правильный ответ, но и понимание того, почему решение работает.\n\nФормат — индивидуальные онлайн-занятия. Стоимость: 2 500 ₽ / 60 минут.\n\nЕсли хотите сначала понять, где именно сейчас пробелы, можно начать с короткой бесплатной диагностики."},
{title:"Ответ на входящий запрос",body:"Здравствуйте! Спасибо за сообщение 😊\n\nЧтобы не предлагать вам универсальную программу вслепую, предлагаю сначала коротко разобраться с задачей: какой класс, какая цель, когда экзамен и что сейчас даётся сложнее всего. После этого можно сделать небольшую диагностику и я покажу, на что стоит обратить внимание в первую очередь.\n\nЕсли вам подходит такой формат, напишите класс и цель — сориентирую по следующему шагу."},
{title:"Приглашение на диагностику",body:"Предлагаю начать с короткой бесплатной диагностики. Она занимает немного времени и нужна не для оценки «хорошо/плохо», а чтобы понять, где именно сейчас находится ученик.\n\nПосмотрим цель, текущий уровень и несколько небольших заданий, а затем я покажу сильные стороны, пробелы и возможный план подготовки.\n\nВ результате у вас будет не просто мнение преподавателя, а понятный ответ: что уже получается, что мешает и с чего логичнее начать."},

function clone(v){return JSON.parse(JSON.stringify(v));}
function load(){

    const raw=localStorage.getItem(KEY);
    if(!raw) return clone(defaultState);
    const saved=JSON.parse(raw);
    return {
      ...clone(defaultState), ...saved,
      settings:{...clone(defaultState).settings,...(saved.settings||{})},
      students:Array.isArray(saved.students)?saved.students:[],
      partners:Array.isArray(saved.partners)?saved.partners:[],
      
      events:Array.isArray(saved.events)?saved.events:[],navOrder:Array.isArray(saved.navOrder)?saved.navOrder:clone(defaultState.navOrder),

      moods:Array.isArray(saved.moods)?saved.moods:[],currentMood:saved.currentMood||null,dayHistory:Array.isArray(saved.dayHistory)?saved.dayHistory:[],todaySkillMarks:Array.isArray(saved.todaySkillMarks)?saved.todaySkillMarks:[],

      skillPractice:saved.skillPractice||{},marketingTasks:Array.isArray(saved.marketingTasks)?saved.marketingTasks:clone(defaultMarketingTasks),texts:Array.isArray(saved.texts)?saved.texts:clone(defaultTexts),partners:Array.isArray(saved.partners)?saved.partners:[],marketingHistory:Array.isArray(saved.marketingHistory)?saved.marketingHistory:[],summerPlan:saved.summerPlan||null
    };
  }catch(e){return clone(defaultState);}
}

function toast(t){

  x.textContent=t;x.classList.add("show");

}

function editSkillLog(id){let i=state.skillLogs.findIndex(x=>x.id===id);if(i<0)return;let l=state.skillLogs[i];showModal('Изменить отметку',`<form class="form" onsubmit="saveSkillLogEdit(event,${i})"><label>Навык<select name="skill">${['СТОП','ТРУД','ТЕПЛО','ПЕРЕКЛЮЧИСЬ','ДАНО','МУДРЫЙ РАЗУМ','ОСОЗНАННОСТЬ','ЭМОЦИОНАЛЬНАЯ РЕГУЛЯЦИЯ','МЕЖЛИЧНОСТНЫЕ НАВЫКИ'].map(n=>`<option ${n===l.skill?'selected':''}>${n}</option>`).join('')}</select></label>${formField('Ситуация','situation',l.situation)}<label>Комментарий<textarea name="comment">${esc(l.comment||'')}</textarea></label><label>Помогло?<select name="helped"><option ${l.helped==='да'?'selected':''}>да</option><option ${l.helped==='частично'?'selected':''}>частично</option><option ${l.helped==='нет'?'selected':''}>нет</option></select></label><button class="btn">Сохранить</button></form>`)}
function saveSkillLogEdit(e,i){e.preventDefault();let f=new FormData(e.target),old=state.skillLogs[i];const prev=old.skill;old.skill=f.get('skill');old.situation=f.get('situation');old.comment=f.get('comment');old.helped=f.get('helped');state.skillPractice[prev]=Math.max(0,(state.skillPractice[prev]||1)-1);state.skillPractice[old.skill]=(state.skillPractice[old.skill]||0)+1;save();closeModal();render();toast('Изменения сохранены')}
function deleteSkillLog(id){if(!confirm('Удалить эту запись навыка из истории?'))return;let i=state.skillLogs.findIndex(x=>x.id===id);if(i<0)return;let skill=state.skillLogs[i].skill;state.skillLogs.splice(i,1);state.skillPractice[skill]=Math.max(0,(state.skillPractice[skill]||1)-1);if(!state.skillLogs.some(x=>x.skill===skill && String(x.at||'').slice(0,10)===todayKey()))state.todaySkillMarks=(state.todaySkillMarks||[]).filter(x=>x!==skill);state.dayHistory=(state.dayHistory||[]).map(h=>({...h,skills:(h.skills||[]).filter(x=>x.id!==id)}));save(false);render();toast('Запись навыка удалена из истории')}
function deleteDayHistory(i){if(!confirm('Удалить этот день из истории?'))return;if(!state.dayHistory?.[i])return;state.dayHistory.splice(i,1);save(false);render();toast('День удалён из истории')}
function updateStepEnergy(){const el=document.querySelector('.energy i'),label=document.getElementById('energyText');if(!el)return;const today=new Date().toISOString().slice(0,10);const taskDone=(state.marketingTasks||[]).filter(t=>t.done && String(t.doneAt||'').slice(0,10)===today).length;const skillDone=(state.skillLogs||[]).filter(x=>String(x.at||'').slice(0,10)===today).length;const bc=(state.bodyCare&&state.bodyCare.date===today)?state.bodyCare.today||{}:{};const bodyDone=Math.min(3,(bc.water||0)+(bc.food||0)+(bc.move||0));const total=10;const score=Math.min(total,taskDone+skillDone+bodyDone);const pct=score===0?0:Math.min(100,Math.round((score/total)*100));el.style.width=pct+'%';if(label)label.textContent=score===0?'Можно начать с чего-нибудь маленького 💚':score>=8?'Молодец! Так держать 💚':score>=4?'Уже есть движение. Так держать 🌿':'Хорошо, один шаг за раз 💚';}
function money(n){return new Intl.NumberFormat("ru-RU").format(Number(n)||0)+" ₽"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function applyNavOrder(){const nav=document.querySelector('.nav');if(!nav)return;const order=Array.isArray(state.navOrder)&&state.navOrder.length===CANONICAL_NAV.length?state.navOrder:CANONICAL_NAV;const map=new Map([...nav.querySelectorAll('.navbtn')].map(b=>[b.dataset.page,b]));order.forEach(id=>{const b=map.get(id);if(b)nav.appendChild(b)});nav.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function render(){document.getElementById("content").innerHTML=pages[page]();applyNavOrder();updateStepEnergy();}

<div class="grid grid-2"><div class="card"><div class="section-head" style="margin:0 0 8px"><h3>Как я сейчас?</h3><span>${last?`Отмечено: ${esc(last.label)}`:"Можно отметить"}</span></div><p class="muted">Выбери одно состояние — это просто быстрый ориентир для себя, без оценок и без обязательств что-то менять.</p><div class="mood-row">${[["😌","Спокойно"],["🙂","Нормально"],["😕","Напряжённо"],["😣","Тяжело"],["🫠","Перегруз"]].map(([x,l])=>`<button title="${l}" class="mood ${last?.emoji===x?"selected":""}" onclick="setMood('${x}','${l}')"><span>${x}</span><small>${l}</small></button>`).join("")}</div>${last?`<button class="small-edit" style="margin-top:10px" onclick="clearMood()">Убрать текущую отметку</button>`:`<p class="note" style="margin-top:10px">Это только текущая отметка. После «Закончить день» она уйдёт из текущего состояния, но останется в истории.</p>`}</div><div class="card" style="background:#ffe7d7"><h3>Навыки КПТ</h3><p class="note">КПТ-навыки ниже устроены так же, как ДБТ: что это → зачем → когда → пошагово. Нажми на любой.</p><div class="grid">${kpt.map((x,i)=>`<button class="card editable" style="text-align:left;padding:14px" onclick="showKptSkill(${i})"><b>${x[0]}</b><div class="muted">${x[1]}</div></button>`).join("")}</div></div></div>
<div class="section-head"><h2>Работа с телом</h2><span>не ждать, пока организм сам напомнит</span></div><div class="grid grid-3"><div class="card"><h3>Вода</h3><p class="note">Поставь воду рядом с рабочим местом. Задача не «пить идеально», а сделать воду заметной.</p><button class="small-edit" onclick="bodyCare('water')">${state.bodyCare?.date===new Date().toISOString().slice(0,10)&&state.bodyCare?.today?.water?"Отменить отметку":"Я попила"}</button></div><div class="card"><h3>Еда</h3><p class="note">Если прошло много времени после еды, сначала проверь: «Я не голодна?» Регулярный приём пищи — часть рабочей опоры, а не награда за продуктивность.</p><button class="small-edit" onclick="bodyCare('food')">${state.bodyCare?.date===new Date().toISOString().slice(0,10)&&state.bodyCare?.today?.food?"Отменить отметку":"Я поела"}</button></div><div class="card"><h3>Тело</h3><p class="note">60–120 секунд: встать, расправить плечи, пройтись, почувствовать стопы, сделать несколько мягких движений.</p><button class="small-edit" onclick="bodyCare('move')">${state.bodyCare?.date===new Date().toISOString().slice(0,10)&&state.bodyCare?.today?.move?"Отменить отметку":"Размяться"}</button></div></div>
<div class="body-progress card" style="margin-top:14px;background:#f8f4ff"><div class="section-head" style="margin:0 0 10px"><h2>Трекер заботы о теле</h2><span>Сегодня</span></div><div class="progress"><i style="width:${Math.round((["water","food","move"].filter(k=>(state.bodyCare?.date===new Date().toISOString().slice(0,10))&&state.bodyCare?.today?.[k]).length/3)*100)}%"></i></div><p class="note">${((state.bodyCare||{}).today?.water||0)+((state.bodyCare||{}).today?.food||0)+((state.bodyCare||{}).today?.move||0)} из 3 маленьких забот о себе сегодня. ${(((state.bodyCare||{}).today?.water||0)+((state.bodyCare||{}).today?.food||0)+((state.bodyCare||{}).today?.move||0))>=3?"Молодец! Так держать 💚":"Можно добавить ещё один маленький шаг, когда будет удобно 🌿"}</p></div><div class="section-head"><h2>ДБТ · карта навыков</h2><span class="pill">${logs.length} тренировок</span></div><div class="card"><p class="note">ДБТ — практические навыки для устойчивости, осознанности, эмоциональной и межличностной регуляции. Нажми на навык, чтобы открыть полноценную инструкцию.</p><div class="grid grid-2">${skills.map((s,i)=>`<button type="button" class="card editable" style="padding:16px;text-align:left;width:100%;border:1px solid var(--line);font:inherit" onclick="showSkill(${i})"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${s[0]}</b><div class="muted" style="margin-top:4px">${s[1]}</div></div><span class="pill">${(state.skillPractice||{})[s[0]]||0}×</span></div><p class="note" style="margin-top:10px">${s[2]}</p></button>`).join("")}</div></div>
<div class="section-head"><h2>Тренировка навыков</h2><span>ошиблась — можно изменить или удалить</span></div><div class="card"><div class="list">${logs.length?logs.slice().reverse().slice(0,12).map(l=>`<div class="list-item"><div><b>${esc(l.skill)}</b><div class="muted">${esc(l.situation||"")} · ${new Date(l.at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div><div class="note">${esc(l.comment||"")}</div></div><div class="actions"><span class="pill">${l.helped||"—"}</span><button class="small-edit" onclick="editSkillLog('${l.id}')">Изменить</button><button class="small-edit" onclick="deleteSkillLog('${l.id}')">Удалить</button></div></div>`).join(""):`<div class="empty">Пока нет записей. Выбери один маленький навык — этого достаточно.</div>`}</div></div>
<div class="section-head"><h2>Моя заметка</h2></div><div class="card"><textarea id="balanceNote" class="form" style="width:100%;min-height:130px" placeholder="Что происходит? Что мне сейчас нужно?">${esc(state.notes||"")}</textarea><br><button class="btn" onclick="state.notes=document.getElementById('balanceNote').value;save();toast('Сохранено')">Сохранить</button></div><div class="card" style="margin-top:16px;background:#e8f4e6"><div class="section-head" style="margin:0 0 10px"><div><h3>Закончить день</h3><p class="note" style="margin:4px 0 0">Соберу сегодняшний итог в историю. Сбросятся только текущие отметки эмоциональной регуляции — остальные данные останутся.</p></div><button class="btn" onclick="finishDay()">Закончить день</button></div><p class="note">Сегодня: ${todaySkills.length} тренировок навыков · ${((state.moods||[]).filter(x=>String(x.at||'').slice(0,10)===today)).length} отметок состояния.</p></div>
<div class="section-head"><h2>История состояний</h2><span>${history.length} завершённых дней</span></div><div class="card"><div class="list">${history.length?history.map((h,hi)=>{const m=h.mood?`${h.mood.emoji} ${esc(h.mood.label)}`:'Состояние не отмечено';const sk=(h.skills||[]);const bc=h.bodyCare||{};const body=['water','food','move'].filter(k=>bc[k]).length;return `<div class="list-item"><div style="width:100%"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><b>${esc(h.date)}</b><div class="muted">${m}</div></div><button class="small-edit" onclick="deleteDayHistory(${hi})">Удалить день</button></div><div class="note" style="margin-top:8px"><b>Навыки:</b> ${sk.length?sk.map(x=>`<span class="pill" style="display:inline-flex;align-items:center;gap:6px;margin:2px">${esc(x.skill)} <button type="button" style="border:0;background:transparent;cursor:pointer;padding:0;font:inherit" title="Удалить запись навыка" onclick="event.stopPropagation();deleteSkillLog('${escAttr(x.id)}')">×</button></span>`).join(' '):'Навыки не отмечены'}</div><div class="note">Забота о теле: ${body} из 3 · Маркетинговые шаги: ${(h.marketingTasks||[]).length}</div>${h.note?`<div class="note">Заметка: ${esc(h.note)}</div>`:''}</div></div>`}).join(''):`<div class="empty">Здесь появятся твои реальные записи после завершения дня. Готовых «правильных ответов» здесь нет.</div>`}</div></div>
<div class="card" style="margin-top:16px;background:#fafaf8"><p class="note"><b>Важно:</b> это справочник и трекер самопомощи, а не замена психотерапии.</p></div></div>`},


development:()=>{
let s=state.settings,tasks=state.marketingTasks||[],done=tasks.filter(t=>t.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0,active=activeStudents(),goalCount=countedGoalStudents(),target=Math.max(0,(Number(s.targetStudents)||0)-goalCount);
return `<div class="page"><div class="title-row"><div><div class="eyebrow">Рост без перегруза</div><h1>План развития</h1><div class="subtitle">Не надо придумывать, что делать. Здесь уже собраны готовые действия, тексты и материалы. Твоя задача — выбрать следующий шаг и при желании отредактировать его под себя.</div></div><div class="actions"><button class="btn" onclick="editSettings()">Изменить цель</button><button class="btn secondary" onclick="editMarketingTask()">+ Добавить свой шаг</button></div></div>
<div class="grid grid-4"><div class="card goal"><div class="muted">ЦЕЛЬ ПРОДВИЖЕНИЯ</div><div class="big">+${target}</div><p class="note">действующих учеников до цели</p></div><div class="card"><div class="muted">СТАВКА</div><div class="big">${money(s.price)}</div><p class="note">за 60 минут</p></div><div class="card"><div class="muted">ОРИЕНТИР</div><div class="big">+${money(target*s.price*4)}</div><p class="note">в месяц при 1 занятии в неделю</p></div><div class="card"><div class="muted">ПРОГРЕСС</div><div class="big">${pct}%</div><div class="progress"><i style="width:${pct}%"></i></div><p class="note">${done} из ${tasks.length} шагов</p></div></div>
<div class="card" style="margin-top:16px;background:#ffe7d7"><h3>Зачем вообще это делать?</h3><p class="note">Цель не в том, чтобы стать «маркетологом» или делать всё каждый день. Цель — постепенно создать поток обращений: <b>найти → заинтересовать → диагностика → первый урок → регулярные занятия → результат → рекомендация.</b> Главная метрика — новые регулярные ученики, а не лайки и подписчики.</p></div>
<div class="section-head"><h2>Трекер продвижения</h2><span>можно продолжать и редактировать, а не начинать заново</span></div><div class="card"><div class="progress" style="height:14px;margin-bottom:18px"><i style="width:${pct}%"></i></div>${tasks.map((t,i)=>`<div class="marketing-task ${t.done?'done':''}"><label class="check-wrap"><input type="checkbox" ${t.done?'checked':''} onchange="toggleMarketingTask(${i})"><span class="checkmark"></span></label><div class="marketing-copy" onclick="showMarketingTask(${i})"><div class="marketing-title">${esc(t.title)}</div><div class="marketing-meta">${esc(t.where||'')} · ~${t.time||5} мин</div><div class="marketing-why"><b>Зачем:</b> ${esc(t.why||'')}</div><div class="marketing-benefit"><b>Польза:</b> ${esc(t.benefit||'')}</div><div class="muted" style="margin-top:8px">Нажми, чтобы открыть готовую инструкцию →</div></div><button class="small-edit" onclick="editMarketingTask(${i})">Изменить</button></div>`).join('')}<div class="actions" style="margin-top:16px"><button class="small-edit" onclick="resetMarketingTasks(false)">Снять отметки, не удаляя историю</button><button class="small-edit" onclick="resetMarketingTasks(true)">Сохранить текущий прогресс и продолжить</button></div></div>
<div class="section-head"><h2>Воронка</h2><span>каждый этап отвечает на вопрос «что делать дальше?»</span></div><div class="grid grid-3"><div class="card"><span class="tag green">1 · Найти</span><h3>Источники</h3><p class="note">Profi, Avito, Яндекс Услуги, YouDo, рекомендации, партнёры, Telegram.</p><button class="small-edit" onclick="showMarketingStage('find')">Открыть готовый план</button></div><div class="card"><span class="tag green">2 · Диагностика</span><h3>Понять запрос</h3><p class="note">Класс → цель → уровень → 3–5 заданий → пробелы → следующий шаг.</p><button class="small-edit" onclick="showMarketingStage('diagnostic')">Открыть сценарий</button></div><div class="card"><span class="tag orange">3 · Первый урок</span><h3>Показать подход</h3><p class="note">Готовая логика первого занятия и перехода в регулярный формат.</p><button class="small-edit" onclick="showMarketingStage('lesson')">Открыть</button></div><div class="card"><span class="tag blue">4 · Регулярность</span><h3>Дать систему</h3><p class="note">Понятная цель, частота, план и следующие шаги.</p></div><div class="card"><span class="tag blue">5 · Результат</span><h3>Зафиксировать прогресс</h3><p class="note">Что стало получаться, какие темы закрыты и какие ошибки ушли.</p></div><div class="card"><span class="tag green">6 · Рекомендация</span><h3>Мягко попросить</h3><p class="note">Готовый текст уже есть в «Готовых текстах».</p></div></div>
<div class="card" style="margin-top:12px;background:#f8f4ff"><div class="section-head" style="margin:0 0 10px"><h3>Мои каналы</h3><span>VK и Telegram остаются здесь</span></div><form class="form inline-form" onsubmit="saveChannels(event)">${formField("VK","vk",s.vk||"")}${formField("Telegram","telegram",s.telegram||"")}<button class="btn">Сохранить каналы</button></form>${(s.vk||s.telegram)?`<div class="actions" style="margin-top:12px">${s.vk?`<a class="btn secondary" href="${escAttr(s.vk)}" target="_blank" rel="noopener">VK · открыть канал ↗</a>`:''}${s.telegram?`<a class="btn secondary" href="${escAttr(s.telegram)}" target="_blank" rel="noopener">Telegram · открыть канал ↗</a>`:''}</div>`:''}</div><div class="card" style="margin-top:12px;background:#fafaf8"><div class="section-head" style="margin:0 0 10px"><h3>Где искать учеников</h3><span>внешние площадки</span></div><p class="note">Это не твои каналы и не партнёры. Здесь можно открыть площадку и работать с её аудиторией отдельно.</p><div class="actions" style="flex-wrap:wrap"><a class="btn secondary" href="https://profi.ru/repetitor/web/" target="_blank" rel="noopener">Профи · репетиторы ↗</a><a class="btn secondary" href="https://uslugi.yandex.ru/213-moscow/catalog?rubric=%2Frepetitory-i-obucenie" target="_blank" rel="noopener">Яндекс Исполнители · репетиторы ↗</a><a class="btn secondary" href="https://www.avito.ru/" target="_blank" rel="noopener">Авито · услуги ↗</a><a class="btn secondary" href="https://repetitor.ru/" target="_blank" rel="noopener">Репетитор.ру ↗</a><a class="btn secondary" href="https://youdo.com/coach" target="_blank" rel="noopener">YouDo · репетиторы ↗</a></div></div>
<div class="section-head"><h2>Минимальный режим</h2><span>можно сделать даже в плохой день</span></div><div class="grid grid-4"><div class="card minimum"><h3>5 минут</h3><p>1 сообщение или 1 отклик.</p></div><div class="card minimum"><h3>15 минут</h3><p>3 сообщения/отклика.</p></div><div class="card minimum"><h3>30 минут</h3><p>1 потенциальный партнёр.</p></div><div class="card minimum"><h3>60 минут</h3><p>Полный блок привлечения.</p></div></div></div>`},
summer:()=>{const phases=[['Февраль — март','Подготовить','Смысл: сначала собрать фундамент, чтобы потом не придумывать всё на ходу.','Профиль Profi + объявление Avito + Репетитор.ру + Яндекс Услуги + диагностика + готовые тексты + папка материалов + 2–3 первых партнёра.','Открыть готовый чек-лист','prepare'],['Апрель','Предложить','Смысл: превратить подготовленные материалы в реальные обращения.','Отклики, ответы, диагностика, публикации и первые сообщения. Не делать всё сразу — выбрать 1–2 канала.','Открыть готовые действия','offer'],['Май — июнь','Набрать','Смысл: переводить обращения в первые и регулярные занятия.','Проводить диагностики, показывать пользу первого урока, фиксировать следующий шаг и заполнять расписание.','Открыть сценарий воронки','get'],['Июль','Удержать','Смысл: не потерять уже созданный поток и собрать доказательства результата.','Фиксировать прогресс, просить отзывы и рекомендации, смотреть источники учеников.','Открыть готовые тексты','retain'],['Август','Подготовить сентябрь','Смысл: войти в учебный год без аврала.','Добрать недостающих учеников, обновить расписание, определить комфортную нагрузку и подготовить материалы.','Открыть план сентября','september']]; return `<div class="page"><div class="title-row"><div><div class="eyebrow">Сезонный план</div><h1>План на лето</h1><div class="subtitle">Не список «надо». Это маршрут: что делать, зачем это нужно, какой результат ждать и где взять готовые материалы.</div></div></div><div class="card" style="margin-bottom:16px;background:#e8f4e6"><h3>Что важно знать про лето</h3><p class="note">Летом часть школьных учеников ставит занятия на паузу, поэтому цель — не ждать августа, а заранее подготовить профиль, отзывы, материалы и контакты. Август и сентябрь обычно становятся главным окном набора, поэтому к нему лучше прийти уже с готовыми текстами, понятной диагностикой и свободными слотами.</p><p class="note">Для Саши это значит: весной — подготовить систему, в июне–июле — спокойно поддерживать присутствие и собирать доказательства результата, в августе — активнее переводить готовые материалы в заявки и записи.</p></div><div class="grid">${phases.map((x,i)=>`<div class="card summer-phase"><div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start"><div><span class="tag ${i%2?'orange':'green'}">${x[0]}</span><h2>${x[1]}</h2></div><span class="pill">${i+1}/5</span></div><p><b>Зачем:</b> ${x[2]}</p><p class="note"><b>Что делать:</b> ${x[3]}</p><button class="btn secondary" onclick="showSummerStage('${x[5]}')">${x[4]} →</button></div>`).join('')}</div><div class="summer-note">У тебя все получится!<br><span>И не надо думать, что ты делаешь недофтаточно!</span></div></div>`},
texts:()=>{let texts=state.texts||defaultTexts;return `<div class="page"><div class="title-row"><div><div class="eyebrow">Маркетинг · готовые коммуникации</div><h1>Готовые тексты</h1><div class="subtitle">Не просто шаблоны. Это тексты под разные точки воронки: привлечь внимание → объяснить пользу → привести к диагностике → перевести в занятия → получить рекомендацию.</div></div><button class="btn" onclick="addText()">+ Новый текст</button></div><div class="card" style="margin-bottom:16px;background:#fffaf0"><h3>Как пользоваться</h3><p class="note">Не нужно копировать всё подряд. Выбери ситуацию, подставь конкретные детали и оставь живой человеческий тон. Главная задача текста — не «продать любой ценой», а сделать следующий шаг понятным.</p></div><div class="grid">${texts.map((t,i)=>`<div class="card"><div class="student-card"><div style="width:100%"><div class="student-name">${esc(t.title)}</div><div class="student-meta" style="margin-top:12px;white-space:pre-line">${esc(t.body)}</div></div></div><div class="actions" style="margin-top:16px"><button class="btn" onclick="copyText(${i})">Копировать</button><button class="small-edit" onclick="editText(${i})">Изменить</button><button class="small-edit" onclick="deleteText(${i})">Удалить</button></div></div>`).join("")}</div></div>`},

 другие смежные предметы. В первую очередь — преподавателей, которые работают с теми же возрастами и экзаменами, что и Саша.</p><p class="note"><b>Как выбирать:</b> сначала смотри отзывы и специализацию, затем формат работы и то, как человек отвечает. Цель — не собрать много контактов, а найти 2–3 адекватных специалистов, которым реально можно передать ученика.</p><p class="note"><b>Первое сообщение:</b> коротко представься, скажи, что хочешь обмениваться рекомендациями, и предложи сохранить контакты друг друга.</p></div><div class="grid">${ps.length?ps.map((p,i)=>`<div class="card"><div class="student-card"><div><div class="student-name">${esc(p.name)}</div><div class="student-meta">${esc(p.subject||'Предмет не указан')} · ${esc(p.contact||'Контакт не указан')}</div><p class="note" style="white-space:pre-line">${esc(p.agreement||'Договорённости пока не записаны')}</p></div><div class="actions"><button class="small-edit" onclick="editPartner(${i})">Изменить</button><button class="small-edit" onclick="deletePartner(${i})">Удалить</button></div></div></div>`).join(''):`<div class="card empty">Партнёров пока нет. Добавь первого, когда появится хороший контакт.</div>`}</div></div>`},

<div class="section-head"><h2>Порядок разделов</h2></div><div class="card"><p class="note">Настрой меню так, как удобно тебе. Порядок сохраняется.</p><div class="list">${state.navOrder.map((id,i)=>{const b=document.querySelector(`.navbtn[data-page="${id}"]`);return `<div class="list-item"><b>${esc(b?.textContent?.trim()||id)}</b><div class="actions"><button class="small-edit" onclick="moveNav(${i},-1)">↑</button><button class="small-edit" onclick="moveNav(${i},1)">↓</button></div></div>`}).join("")}</div></div><div class="card" style="margin-top:16px;background:#f8f4ff"><h3>Навигация</h3><p class="note">Можно менять порядок разделов кнопками ↑ ↓. Если захочешь вернуть исходный порядок, нажми кнопку ниже.</p><button class="small-edit" onclick="resetNavOrder()">Вернуть порядок разделов</button></div><div class="section-head"><h2>Резервная копия</h2></div><div class="card"><div class="actions"><button class="btn secondary" onclick="exportData()">Скачать резервную копию</button><label class="btn secondary" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer">Восстановить <input type="file" accept="application/json" id="backupInput" onchange="importBackup(this)" style="display:none"></label><button class="btn danger" onclick="resetData()">Сбросить все данные</button></div><p class="note">Резервная копия сохраняет данные кабинета в JSON-файл. Восстановление загружает сохранённую копию обратно. Файлы, прикреплённые к папкам учеников, хранятся отдельно в браузере.</p></div></div>`}

function showModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function formField(label,name,value="",type="text"){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}"></label>`}
function editSettings(){let s=state.settings;showModal("Настройки",`<form class="form" onsubmit="saveSettings(event)">${formField("Имя","name",s.name||"Саша")}${formField("Специализация","specialization",s.specialization||"Репетитор по информатике")}${formField("Описание","description",s.description||"")}${formField("Факт дохода сейчас","income",s.income,"number")}${formField("Целевой доход в месяц","targetIncome",s.targetIncome,"number")}${formField("Цель по количеству учеников","targetStudents",s.targetStudents,"number")}<div class="note">Это твоя ручная цель: сколько действующих учеников ты хочешь иметь. Доход и цена занятия её не меняют.</div>${formField("Цена урока","price",s.price,"number")}<button class="btn">Сохранить изменения</button></form>`)}
function saveChannels(e){e.preventDefault();let f=new FormData(e.target);state.settings.vk=f.get("vk")||"";state.settings.telegram=f.get("telegram")||"";save();render();toast("Каналы сохранены — кнопки для открытия появились ниже")}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);state.settings.name=f.get("name")||"Саша";state.settings.specialization=f.get("specialization")||"";state.settings.description=f.get("description")||"";["income","targetIncome","targetStudents","price"].forEach(k=>state.settings[k]=Number(f.get(k)||0));state.settings.targetStudentsManual=true;syncDerivedSettings();save();closeModal();render()}

function newStudent(){showModal("Новый ученик",`<form class="form" onsubmit="saveStudent(event)">${formField("Имя","name")}${formField("Цель","goal","ЕГЭ по информатике")}${formField("Цена урока","price",state.settings.price,"number")}<label>Статус<select name="status"><option value="active">Действующий ученик</option><option value="trial">Записался на пробник</option><option value="left">Ушёл</option></select></label><label>Оплата<select name="paymentStatus"><option value="unpaid">Не оплачено</option><option value="pending">Оплатит</option><option value="paid">Оплачено</option><option value="prepaid">Курс оплачен вперёд</option></select></label>${formField("Занятий оплачено вперёд","prepaidLessons",0,"number")}<label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:8px"><input type="checkbox" name="newForPlan" checked> Учитывать этого ученика в прогрессе цели</label><label>Заметка<textarea name="note"></textarea></label><button class="btn">Создать папку</button></form>`)}
function editStudent(i){let s=state.students[i];showModal("Редактировать ученика",`<form class="form" onsubmit="saveStudent(event,${i})">${formField("Имя","name",s.name)}${formField("Цель","goal",s.goal)}${formField("Цена урока","price",s.price,"number")}<label>Статус<select name="status"><option value="active" ${s.status==="active"||!s.status?"selected":""}>Действующий ученик</option><option value="trial" ${s.status==="trial"?"selected":""}>Записался на пробник</option><option value="left" ${s.status==="left"?"selected":""}>Ушёл</option></select></label><label>Оплата<select name="paymentStatus"><option value="unpaid" ${s.paymentStatus==="unpaid"||!s.paymentStatus?"selected":""}>Не оплачено</option><option value="pending" ${s.paymentStatus==="pending"?"selected":""}>Оплатит</option><option value="paid" ${s.paymentStatus==="paid"?"selected":""}>Оплачено</option><option value="prepaid" ${s.paymentStatus==="prepaid"?"selected":""}>Курс оплачен вперёд</option></select></label>${formField("Занятий оплачено вперёд","prepaidLessons",s.prepaidLessons||0,"number")}<label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:8px"><input type="checkbox" name="newForPlan" ${s.newForPlan?"checked":""}> Учитывать этого ученика в прогрессе цели</label><label>Заметка<textarea name="note">${esc(s.note)}</textarea></label><label>Заметки по урокам<textarea name="lessons">${esc(s.lessons||"")}</textarea></label><label>Оплата / расчёты<textarea name="payments">${esc(s.payments||"")}</textarea></label><button class="btn">Сохранить изменения</button></form>`)}
function saveStudent(e,i){e.preventDefault();let f=new FormData(e.target),old=i==null?null:state.students[i],obj={id:old?.id||("st_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)),name:f.get("name"),goal:f.get("goal"),price:Number(f.get("price")),status:f.get("status")||old?.status||"active",paymentStatus:f.get("paymentStatus")||old?.paymentStatus||"unpaid",prepaidLessons:Number(f.get("prepaidLessons")||0),newForPlan:f.get("newForPlan")==="on",note:f.get("note"),lessons:f.get("lessons")||"",payments:f.get("payments")||"",plans:old?.plans||[],history:old?.history||[]};if(old){const changes=[];if(old.status!==obj.status)changes.push(`Статус: ${old.status||'действующий'} → ${obj.status}`);if(old.paymentStatus!==obj.paymentStatus)changes.push(`Оплата: ${old.paymentStatus||'не оплачено'} → ${obj.paymentStatus}`);if(Number(old.prepaidLessons||0)!==obj.prepaidLessons)changes.push(`Оплачено вперёд: ${old.prepaidLessons||0} → ${obj.prepaidLessons}`);if(changes.length)obj.history.push({at:new Date().toISOString(),type:'Изменение',text:changes.join(' · ')});}else{obj.history=[{at:new Date().toISOString(),type:'Создан',text:'Ученик добавлен в базу'}];}if(i==null)state.students.push(obj);else state.students[i]=obj;syncDerivedSettings();save();closeModal();render()}
async function openStudent(i){const s=state.students[i];if(!s)return;const files=await getStudentFiles(s.id);showModal("Папка · "+esc(s.name),`<div class="student-folder"><div class="card"><h3>Профиль</h3><p><b>Цель:</b> ${esc(s.goal||"—")}</p><p><b>Цена:</b> ${money(s.price||state.settings.price)} / урок</p><p><b>Оплата:</b> ${s.paymentStatus==="paid"?"Оплачено":s.paymentStatus==="pending"?"Оплатит":s.paymentStatus==="prepaid"?"Курс оплачен вперёд":"Не оплачено"}${s.prepaidLessons?` · ${s.prepaidLessons} занятий вперёд`:""}</p><p class="note">${esc(s.note||"Заметок пока нет")}</p><button class="small-edit" onclick="editStudent(${i})">Редактировать</button></div><div class="card"><h3>Материалы</h3><div class="upload">Добавить файлы<br><br><input type="file" multiple onchange="addStudentFiles('${s.id}',this)"></div><div class="file-list">${files.length?files.map(f=>`<div class="file-item"><span>📎 ${esc(f.name)}</span><span><button class="small-edit" onclick="openStudentFile(${f.id})">Открыть</button><button class="small-edit" onclick="markFileReviewed(${f.id},'${s.id}')">${f.reviewed?"✓ Просмотрен":"Отметить"}</button><button class="small-edit" onclick="deleteStudentFile(${f.id},'${s.id}')">×</button></span></div>`).join(""):"<div class='note'>Файлов пока нет.</div>"}</div></div></div><div class="section-head"><h2>Планы занятий</h2><button class="btn" onclick="newLessonPlan(${i})">+ Новый план</button></div><div class="card lesson-plan"><div class="list">${(s.plans||[]).length?(s.plans||[]).map((p,j)=>`<div class="list-item"><div><b>${esc(p.title)}</b><div class="muted">${esc(p.date||"")} · ${esc(p.goal||"")}</div></div><div class="actions"><button class="small-edit" onclick="editLessonPlan(${i},${j})">Редактировать</button><button class="small-edit" onclick="deleteLessonPlan(${i},${j})">Удалить</button></div></div>`).join(""):"<div class='empty'>Планов пока нет.</div>"}</div></div><div class="section-head"><h2>История</h2></div><div class="grid grid-2"><div class="card"><h3>Уроки</h3><p class="note">${esc(s.lessons||"")||"Пока пусто"}</p></div><div class="card"><h3>Изменения и оплаты</h3><div class="list">${(s.history||[]).slice().reverse().map(h=>`<div class="list-item"><div><b>${esc(h.type||"Событие")}</b><div class="muted">${new Date(h.at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div><div class="note">${esc(h.text||"")}</div></div></div>`).join("")||'<div class="empty">История появится после изменений.</div>'}</div></div></div>`)}
async function deleteStudent(i){if(confirm(`Удалить ученика «${state.students[i].name}» и его папку?`)){const id=state.students[i].id;try{const db=await fileDB();const tx=db.transaction("files","readwrite"),st=tx.objectStore("files");const req=st.getAll();req.onsuccess=()=>{req.result.filter(x=>x.studentId===id).forEach(x=>st.delete(x.id));};}catch(e){} state.students.splice(i,1);syncDerivedSettings();save();render()}}

const FILE_DB="sasha-student-files-v1";
function fileDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(FILE_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function addStudentFiles(studentId,input){const files=[...(input.files||[])];if(!files.length)return;const db=await fileDB(),tx=db.transaction("files","readwrite"),st=tx.objectStore("files");for(const f of files)st.add({studentId,name:f.name,type:f.type,size:f.size,blob:f,at:new Date().toISOString()});tx.oncomplete=()=>{toast("Файлы добавлены");openStudentById(studentId)}}
async function getStudentFiles(studentId){const db=await fileDB();return new Promise((resolve,reject)=>{const r=db.transaction("files","readonly").objectStore("files").getAll();r.onsuccess=()=>resolve(r.result.filter(x=>x.studentId===studentId));r.onerror=()=>reject(r.error)})}
async function downloadStudentFile(id){const db=await fileDB();const f=await new Promise((resolve,reject)=>{const r=db.transaction("files","readonly").objectStore("files").get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(!f)return;const a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function openStudentFile(id){const db=await fileDB();const f=await new Promise((resolve,reject)=>{const r=db.transaction("files","readonly").objectStore("files").get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(!f)return;const url=URL.createObjectURL(f.blob);window.open(url,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function markFileReviewed(id,studentId){const db=await fileDB();const st=db.transaction("files","readwrite").objectStore("files");const r=st.get(id);r.onsuccess=()=>{let f=r.result;if(f){f.reviewed=!f.reviewed;st.put(f)};setTimeout(()=>openStudentById(studentId),150)}}
async function deleteStudentFile(id,studentId){if(!confirm("Удалить этот файл?"))return;const db=await fileDB();db.transaction("files","readwrite").objectStore("files").delete(id);setTimeout(()=>openStudentById(studentId),150)}

const GOOGLE_CALENDAR_WEBAPP_URL="https://script.google.com/macros/s/AKfycbzIS2aCCBRfydItdVfdPuFTSLQoc7xM-yu9UwL6W7tpZ1FlnIxlw_h_6irQ2bDWMT1g/exec";
function sendEventToGoogleCalendar(ev){
  const start=`${ev.date}T${ev.time||"00:00"}:00+03:00`;
  const startDate=new Date(start);
  const endDate=new Date(startDate.getTime()+Number(ev.duration||60)*60000);
  const payload={title:ev.title||"Урок",start:startDate.toISOString(),end:endDate.toISOString(),description:ev.note||""};
  try{
    fetch(GOOGLE_CALENDAR_WEBAPP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload),keepalive:true});
    return true;
  }catch(err){console.warn("Google Calendar:",err);return false;}
}
function saveEvent(e,i){
  e.preventDefault();
  let f=new FormData(e.target),o={title:f.get("title"),date:f.get("date"),time:f.get("time"),duration:Number(f.get("duration"))||60,note:f.get("note")};
  const isNew=i==null;
  if(isNew){o.id="ev_"+Date.now();state.events.push(o);}else state.events[i]=o;
  state.events.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  save();closeModal();render();
  if(isNew){sendEventToGoogleCalendar(o);toast("Занятие сохранено и отправлено в Google Calendar 📅");}
  else toast("Занятие изменено");
}

function finishDay(){
  const today=todayKey();
  const moodToday=(state.moods||[]).filter(x=>String(x.at||'').slice(0,10)===today);
  const skillsToday=(state.skillLogs||[]).filter(x=>String(x.at||'').slice(0,10)===today);
  const body=(state.bodyCare&&state.bodyCare.date===today)?clone(state.bodyCare.today||{}):{};
  const tasks=(state.marketingTasks||[]).filter(t=>t.done && String(t.doneAt||'').slice(0,10)===today).map(t=>t.title);
  const entry={date:today,finishedAt:new Date().toISOString(),mood:moodToday.length?moodToday[moodToday.length-1]:null,moodHistory:moodToday,skills:skillsToday,bodyCare:body,marketingTasks:tasks,note:state.notes||''};
  state.dayHistory=state.dayHistory||[];
  const idx=state.dayHistory.findIndex(x=>x.date===today);
  if(idx>=0) state.dayHistory[idx]=entry; else state.dayHistory.unshift(entry);
  state.dayHistory=state.dayHistory.slice(0,90);
  state.currentMood=null;
  state.todaySkillMarks=[];
  state.bodyCare={date:today,today:{water:false,food:false,move:false}};
  state.notes='';
  save(false);render();toast("День завершён. Всё сегодняшнее сохранено в истории 💚");
}

function importBackup(e){
  const f=(e?.target?.files||e?.files)?.[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const incoming=JSON.parse(r.result);
      state={
        ...clone(defaultState),...incoming,
        settings:{...clone(defaultState).settings,...(incoming.settings||{})},
        students:Array.isArray(incoming.students)?incoming.students:[],
        events:Array.isArray(incoming.events)?incoming.events:[],navOrder:Array.isArray(incoming.navOrder)?incoming.navOrder:clone(defaultState.navOrder),
        plan:Array.isArray(incoming.plan)?incoming.plan:[],
        moods:Array.isArray(incoming.moods)?incoming.moods:[],
        notes:incoming.notes||"",
        skillLogs:Array.isArray(incoming.skillLogs)?incoming.skillLogs:[],
        skillPractice:incoming.skillPractice||{},
        marketingTasks:Array.isArray(incoming.marketingTasks)?incoming.marketingTasks:clone(defaultMarketingTasks),
        texts:Array.isArray(incoming.texts)?incoming.texts:clone(defaultTexts)
      };
      save(); render(); toast("Резервная копия восстановлена");
    }catch(err){alert("Не удалось прочитать резервную копию.");}
  };
  r.readAsText(f);
}

function importICS(){
  const i=document.createElement("input"); i.type="file"; i.accept=".ics";
  i.onchange=async()=>{
    const f=i.files?.[0]; if(!f)return;
    const t=await f.text();
    const chunks=t.split("BEGIN:VEVENT").slice(1);
    chunks.forEach(c=>{
      const get=k=>(c.match(new RegExp(k+"[^:]*:(.*)"))||[])[1]||"";
      const raw=get("DTSTART");
      const dt=raw.replace(/T/," ");
      const ymd=dt.slice(0,8);
      state.events.push({
        title:get("SUMMARY")||"Событие",
        date:ymd.replace(/(\d{4})(\d{2})(\d{2})/,"$1-$2-$3"),
        time:dt.slice(9,13).replace(/(\d{2})(\d{2})/,"$1:$2"),
        note:get("DESCRIPTION")
      });
    });
    save(); render();
  };
  i.click();
}

    "ТРУД":"В спокойном состоянии отдельно и безопасно попробуй дыхание, мягкое движение, расслабление мышц и прохладную воду — без экстремальных воздействий.",
    "ТЕПЛО":"Раз в день делай минутное сенсорное сканирование: что видишь, слышишь и чувствуешь телом.",
    "ПЕРЕКЛЮЧИСЬ":"Заранее составь список из пяти безопасных занятий на 10–20 минут и используй его при зацикливании.",
    "ДАНО":"Раз в день превращай одну оценочную фразу о событии в нейтральное описание факта.",
    "МУДРЫЙ РАЗУМ":"Перед небольшим решением запиши три строки: эмоция, факты, эффективное действие."
  };
  const st=steps[s[0]]||["Заметь состояние.","Назови цель навыка.","Сделай один небольшой шаг.","После действия оцени результат."];
  showModal(s[0],`<div class="card"><b>Зачем:</b><p class="note">${esc(s[2])}</p><b>Когда:</b><p class="note">${esc(s[3])}</p><h3>Что делать прямо сейчас</h3><ol>${st.map(x=>`<li style="margin:8px 0">${esc(x)}</li>`).join("")}</ol><h3>Как тренировать заранее</h3><p class="note">${esc(training[s[0]]||"Попробуй навык заранее на небольшой ситуации и отметь, что сработало.")}</p></div><br><button class="btn" onclick="logSkill('${esc(s[0])}')">Отметить навык</button>`);
}

function showMarketingTask(i){const t=state.marketingTasks[i];if(!t)return;showModal(t.title,`<div class="card" style="background:#e8f4e6"><b>Что сделать</b><p class="note">${esc(t.instruction||t.title)}</p><b>Зачем</b><p class="note">${esc(t.why||'')}</p><b>Польза</b><p class="note">${esc(t.benefit||'')}</p>${t.copy?`<b>Готовый текст</b><textarea class="form" style="width:100%;min-height:180px;margin-top:8px">${esc(t.copy)}</textarea><button class="btn" style="margin-top:8px" onclick="copyString(${JSON.stringify(t.copy).replace(/</g,'\u003c')})">Скопировать текст</button>`:''}<p class="note" style="margin-top:12px">Время: ~${t.time||5} минут</p></div>`)}
function copyString(x){navigator.clipboard?.writeText(x).then(()=>toast('Скопировано ✓')).catch(()=>toast('Выдели текст и скопируй'))}
function editMarketingTask(i){let t=i==null?{title:'',where:'',time:5,why:'',benefit:'',instruction:'',copy:'',done:false}:state.marketingTasks[i];showModal(i==null?'Новый шаг':'Изменить шаг',`<form class="form" onsubmit="saveMarketingTask(event,${i==null?'null':i})">${formField('Название','title',t.title)}${formField('Где','where',t.where)}${formField('Время, минут','time',t.time,'number')}<label>Что сделать<textarea name="instruction">${esc(t.instruction||'')}</textarea></label><label>Зачем<textarea name="why">${esc(t.why||'')}</textarea></label><label>Польза<textarea name="benefit">${esc(t.benefit||'')}</textarea></label><label>Готовый текст (если нужен)<textarea name="copy">${esc(t.copy||'')}</textarea></label><button class="btn">Сохранить</button></form>`)}
function saveMarketingTask(e,i){e.preventDefault();let f=new FormData(e.target),t={title:f.get('title'),where:f.get('where'),time:Number(f.get('time'))||5,instruction:f.get('instruction'),why:f.get('why'),benefit:f.get('benefit'),copy:f.get('copy'),done:i!=null?state.marketingTasks[i].done:false,doneAt:i!=null?state.marketingTasks[i].doneAt:null,id:i!=null?state.marketingTasks[i].id:'custom_'+Date.now()};if(i==null)state.marketingTasks.push(t);else state.marketingTasks[i]=t;save();closeModal();render()}
function resetMarketingTasks(archive){if(archive){state.marketingHistory=state.marketingHistory||[];state.marketingHistory.push({date:new Date().toISOString(),tasks:clone(state.marketingTasks)});state.marketingTasks=(state.marketingTasks||[]).map(t=>({...t,done:false,doneAt:null}));save();render();toast('Прогресс сохранён в истории');}else{state.marketingTasks=(state.marketingTasks||[]).map(t=>({...t,done:false,doneAt:null}));save();render();toast('Отметки сняты — история не потеряна')}}
function showMarketingStage(stage){const data={find:['Найти учеников','Начни с Profi, Avito и Яндекс Услуг. Открой готовый профиль и объявление из «Готовых текстов», затем сделай 1 подходящий отклик.','Результат: обращение.'],diagnostic:['Диагностика','Короткий разговор → 3–5 заданий → сильные стороны → пробелы → следующий шаг. Готовый текст приглашения уже есть в «Готовых текстах».','Результат: человек понимает проблему и следующий шаг.'],lesson:['Первый урок','Не отдавай полноценный курс бесплатно. Покажи, как ты объясняешь, разбираешь ошибки и строишь план.','Результат: доверие и понятный переход в регулярные занятия.']}[stage];showModal(data[0],`<div class="card"><h3>Что делать</h3><p class="note">${data[1]}</p><h3>Зачем</h3><p class="note">${data[2]}</p><button class="btn" onclick="go('texts');closeModal()">Открыть готовые тексты</button></div>`)}
function showSummerStage(stage){const map={prepare:['Подготовить','1) Открой «Готовые тексты» и скопируй готовые варианты для Profi, Avito и Яндекс Услуг. 2) Вставь их в профили и поправь только фактические данные. 3) Подготовь диагностику. 4) Добавь 2–3 первых контакта в «Партнёры».'],offer:['Предложить','Открой готовые тексты → выбери площадку → сделай 1–3 подходящих отклика → веди человека на диагностику.'],get:['Набрать','После диагностики используй готовый текст перехода в регулярные занятия, добавь план первого урока и поставь следующие занятия в расписание.'],retain:['Удержать','Зафиксируй прогресс ученика, собери отзыв и используй готовый текст просьбы о рекомендации.'],september:['Подготовить сентябрь','Посмотри действующих учеников, расписание и комфортную нагрузку. Затем добери только необходимое количество новых регулярных учеников.']}[stage];showModal(map[0],`<div class="card"><h3>Готовый маршрут</h3><p class="note" style="white-space:pre-line">${map[1]}</p></div>`)}
function newPartner(){showModal('Новый партнёр',`<form class="form" onsubmit="savePartner(event)">${formField('Имя','name')}${formField('Предмет','subject')}${formField('Контакт','contact')}<label>Договорённости<textarea name="agreement" placeholder="Что рекомендуем друг другу, когда списались, что важно помнить"></textarea></label><button class="btn">Сохранить</button></form>`)}
function editPartner(i){let p=state.partners[i];showModal('Редактировать партнёра',`<form class="form" onsubmit="savePartner(event,${i})">${formField('Имя','name',p.name)}${formField('Предмет','subject',p.subject)}${formField('Контакт','contact',p.contact)}<label>Договорённости<textarea name="agreement">${esc(p.agreement||'')}</textarea></label><button class="btn">Сохранить</button></form>`)}
function savePartner(e,i){e.preventDefault();let f=new FormData(e.target),o={name:f.get('name'),subject:f.get('subject'),contact:f.get('contact'),agreement:f.get('agreement')};state.partners=state.partners||[];if(i==null)state.partners.push(o);else state.partners[i]=o;save();closeModal();render()}
function deletePartner(i){if(confirm('Удалить партнёра?')){state.partners.splice(i,1);save();render()}}
function editSkillLog(id){let i=state.skillLogs.findIndex(x=>x.id===id);if(i<0)return;let l=state.skillLogs[i];showModal('Изменить отметку',`<form class="form" onsubmit="saveSkillLogEdit(event,${i})"><label>Навык<select name="skill">${['СТОП','ТРУД','ТЕПЛО','ПЕРЕКЛЮЧИСЬ','ДАНО','МУДРЫЙ РАЗУМ','ОСОЗНАННОСТЬ','ЭМОЦИОНАЛЬНАЯ РЕГУЛЯЦИЯ','МЕЖЛИЧНОСТНЫЕ НАВЫКИ'].map(n=>`<option ${n===l.skill?'selected':''}>${n}</option>`).join('')}</select></label>${formField('Ситуация','situation',l.situation)}<label>Комментарий<textarea name="comment">${esc(l.comment||'')}</textarea></label><label>Помогло?<select name="helped"><option ${l.helped==='да'?'selected':''}>да</option><option ${l.helped==='частично'?'selected':''}>частично</option><option ${l.helped==='нет'?'selected':''}>нет</option></select></label><button class="btn">Сохранить</button></form>`)}
function saveSkillLogEdit(e,i){e.preventDefault();let f=new FormData(e.target),old=state.skillLogs[i];const prev=old.skill;old.skill=f.get('skill');old.situation=f.get('situation');old.comment=f.get('comment');old.helped=f.get('helped');state.skillPractice[prev]=Math.max(0,(state.skillPractice[prev]||1)-1);state.skillPractice[old.skill]=(state.skillPractice[old.skill]||0)+1;save();closeModal();render();toast('Изменения сохранены')}
function deleteSkillLog(id){if(!confirm('Удалить эту запись навыка из истории?'))return;let i=state.skillLogs.findIndex(x=>x.id===id);if(i<0)return;let skill=state.skillLogs[i].skill;state.skillLogs.splice(i,1);state.skillPractice[skill]=Math.max(0,(state.skillPractice[skill]||1)-1);if(!state.skillLogs.some(x=>x.skill===skill && String(x.at||'').slice(0,10)===todayKey()))state.todaySkillMarks=(state.todaySkillMarks||[]).filter(x=>x!==skill);state.dayHistory=(state.dayHistory||[]).map(h=>({...h,skills:(h.skills||[]).filter(x=>x.id!==id)}));save(false);render();toast('Запись навыка удалена из истории')}
function deleteDayHistory(i){if(!confirm('Удалить этот день из истории?'))return;if(!state.dayHistory?.[i])return;state.dayHistory.splice(i,1);save(false);render();toast('День удалён из истории')}
document.querySelectorAll(".navbtn").forEach(x=>x.onclick=()=>go(x.dataset.page)); applyNavOrder();


window.addEventListener("error",e=>{
  const c=document.getElementById("content");
  if(c && !c.dataset.errorShown){
    c.dataset.errorShown="1";
    c.innerHTML=`<div class="page"><div class="card"><h2>Кабинет не загрузился</h2><p class="note">Обнови страницу. Если ошибка повторится — пришли мне этот экран, я исправлю.</p></div></div>`;
  }
});

render();
</script></body></html>
